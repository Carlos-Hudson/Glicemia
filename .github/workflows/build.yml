name: Build Android APK
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite rodar o build manualmente pelo botão no GitHub

jobs:
  build:
    runs-on: ubuntu-22.04 # Versão mais compatível com as ferramentas Android atuais

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Versão recomendada para evitar erros de C++ no KivyMD 1.2.0

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          python3-setuptools libgdbm-dev libc6-dev-i386

      - name: Install Python Tools
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" # ESSENCIAL: Cython 3.x quebra o KivyMD 1.2.0
          pip install buildozer wheel

      - name: Build with Buildozer
        run: |
          # O comando 'yes' aceita as licenças do Android SDK automaticamente
          yes | buildozer -v android debug
        env:
          BUILDOZER_ALLOW_ORG_NAME_AS_DOMAIN: 1
          # Opcional: use BUILDOZER_GITHUB_ACTIONS=1 se tiver problemas de permissão

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-debug
          path: bin/*.apk
